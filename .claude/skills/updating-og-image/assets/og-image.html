<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Hanken+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..700&display=block"
    />
    <style>
      :root {
        --ink: #181b36;
        --paper: #eef0f7;
        --pencil: #9fd3e6;
        --marker: #ffd23f;
        --pad: 80px;
        --cell: 60px;
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* X puts the post title on the bottom left of the image, so the text must end above about y 520. */
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 36px;
        padding: var(--pad);
        background-color: var(--ink);
        background-image:
          linear-gradient(
            color-mix(in oklab, var(--pencil) 7%, transparent) 2px,
            transparent 2px
          ),
          linear-gradient(
            90deg,
            color-mix(in oklab, var(--pencil) 7%, transparent) 2px,
            transparent 2px
          );
        background-size: var(--cell) var(--cell);
        background-position: center;
        color: var(--paper);
        font-family: "Hanken Grotesk", sans-serif;
      }

      body > * {
        text-box: trim-both cap alphabetic;
      }

      .scope {
        color: var(--pencil);
        font-family: "JetBrains Mono", monospace;
        font-size: 34px;
        font-weight: 500;
      }

      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 136px;
        font-weight: 800;
        font-stretch: 78%;
        font-variation-settings: "opsz" 96;
        line-height: 0.9;
        letter-spacing: -0.01em;
      }

      p {
        color: color-mix(in oklab, var(--paper) 82%, var(--ink));
        font-size: 40px;
        font-weight: 500;
        line-height: 1.25;
      }

      /* The mark bleeds off the right edge, so it looks larger than the card. */
      .mark {
        position: absolute;
        top: 50%;
        right: -110px;
        width: 520px;
        translate: 0 -50%;
        color: var(--marker);
      }

      /* render.sh renders the GitHub social preview at 1280×640: the same card, scaled to the 2:1 frame. */
      @media (width: 1280px) {
        html {
          width: 1280px;
          height: 640px;
        }

        body {
          width: 1200px;
          height: 600px;
          zoom: calc(1280 / 1200);
        }
      }
    </style>
  </head>
  <body>
    <div class="scope">@awesome-reveal/*</div>
    <h1>Awesome<br />Reveal</h1>
    <p>Scroll reveal animations for<br />React, Vue, Astro and JavaScript</p>
    <svg class="mark" viewBox="72 152 368 208" aria-hidden="true">
      <g fill="currentColor">
        <circle cx="176" cy="256" r="104" opacity=".25" />
        <circle cx="256" cy="256" r="104" opacity=".5" />
        <circle cx="336" cy="256" r="104" />
      </g>
    </svg>
  </body>
</html>
